packages:
  - packages/*
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  node-pty: true
  # grammar packages: only their prebuilt .wasm is used, never the native binding
  tree-sitter: false
  tree-sitter-elixir: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
versioning:
  changelog:
    storage: repository
overrides:
  dompurify: '>=3.4.17'
  body-parser: '>=2.4.0'
  zod: '>=4.6.6'
  'bunny-transfer>zod': 3.25.76
  'bunny-transfer>file-type': 20.5.0
  '@azure/msal-node': '>=7.1.0'
  file-type: '>=21.3.2'
  postcss-selector-parser: '>=7.1.6'
packageExtensions:
  bunny-transfer:
    dependencies:
      zod: 3.25.76
