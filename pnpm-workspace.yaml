packages:
  - packages/*
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.86'
  - '@ai-sdk/gateway@4.0.122'
  - '@ai-sdk/openai@4.0.100'
  - '@ai-sdk/provider-utils@5.0.66'
  - '@ai-sdk/provider@4.0.32'
  - ai@7.0.149
versioning:
  changelog:
    storage: repository
overrides:
  dompurify: '>=3.4.17'
  body-parser: '>=2.4.0'
  zod: '>=4.6.6'
  '@azure/msal-node': '>=7.1.0'
  file-type: '>=21.3.2'
  postcss-selector-parser: '>=7.1.6'
