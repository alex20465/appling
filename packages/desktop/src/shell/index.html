<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Appling</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <nav class="rail">
      <div id="workspaces" role="group" aria-label="Workspaces"></div>
      <button id="new-workspace" class="workspace add" title="New Workspace…" aria-label="New Workspace">+</button>
      <hr />
      <div id="repos" role="group" aria-label="Repos"></div>
      <button id="open" class="repo add" title="Add Folder to Workspace…" aria-label="Add Folder to Workspace">+</button>
    </nav>
    <main id="stage"></main>
    <script type="module" src="./shell.js"></script>
  </body>
</html>
