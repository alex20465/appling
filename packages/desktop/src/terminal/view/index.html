<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- xterm.js sets inline styles; the image addon decodes sixel with WebAssembly and draws iTerm images from blobs -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:" />
    <title>Terminal</title>
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./view.css" />
  </head>
  <body>
    <div id="grip" title="Drag to resize the panel"></div>
    <header id="bar">
      <div id="tabs" role="tablist" aria-label="Terminals"></div>
      <div class="tools">
        <button id="new" title="New Terminal" aria-label="New Terminal"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
        <button id="profiles" title="New Terminal with Profile…" aria-label="New Terminal with Profile"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
        <button id="split" title="Split Terminal" aria-label="Split Terminal"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1"/><path d="M8 3v10"/></svg></button>
        <button id="kill" title="Kill Terminal" aria-label="Kill Terminal"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button>
        <button id="hide" title="Hide Panel" aria-label="Hide Panel"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
    </header>
    <main id="panes"></main>
    <div id="empty" hidden>
      <p>No terminal in this repo yet.</p>
      <button id="start" class="action">New Terminal</button>
    </div>
    <form id="find" hidden>
      <input type="text" placeholder="Find" aria-label="Find in terminal" spellcheck="false" autocomplete="off" />
      <span class="count"></span>
      <button type="button" data-step="-1" title="Previous Match (Shift+Enter)" aria-label="Previous Match">↑</button>
      <button type="button" data-step="1" title="Next Match (Enter)" aria-label="Next Match">↓</button>
      <button type="button" data-close title="Close (Escape)" aria-label="Close">×</button>
    </form>
    <script type="module" src="./view.js"></script>
  </body>
</html>
