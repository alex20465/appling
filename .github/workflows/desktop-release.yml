name: Desktop Release

# Builds Appling Desktop for Linux (AppImage), Windows (NSIS installer) and macOS (dmg + zip) on a `desktop-v<version>`
# tag and publishes them with the electron-updater manifests (latest*.yml) to a GitHub Release of that tag.
#
# Builds are unsigned until these optional secrets exist (each one is skipped while it is empty):
#   macOS signing:       MAC_CSC_LINK (base64 .p12 of a Developer ID Application certificate), MAC_CSC_KEY_PASSWORD
#   macOS notarization:  APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows certificate: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#   Windows, Azure Trusted Signing instead: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#                        AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_PUBLISHER_NAME
# Unsigned macOS builds cannot update themselves; the app then points to the release page (src/update-policy.ts).

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Cloning
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not desktop-v<semver>." >&2
            exit 1
          fi
          echo "APPLING_DESKTOP_VERSION=$version" >> "$GITHUB_ENV"

      # node-pty builds from source on Linux (python3, make and g++ are on the runner) and uses its prebuilds elsewhere
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @appling/desktop... build

      - name: Bundle
        run: node packages/desktop/scripts/bundle.mjs

      - name: Package
        working-directory: packages/desktop
        run: pnpm exec electron-builder --config electron-builder.config.mjs --publish never ${{ matrix.target }}
        env:
          # macOS: sign and notarize when the secrets exist, else build unsigned without looking for an identity
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: a certificate, or Azure Trusted Signing
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}

      # The AppImage starts without a display for --version: proves it unpacks and its main process loads
      - name: Smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$(ls "$GITHUB_WORKSPACE"/packages/desktop/release/Appling-*.AppImage)"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract > /dev/null
          printed="$(squashfs-root/appling --version)"
          echo "AppImage --version: $printed"
          test "$printed" = "$APPLING_DESKTOP_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # electron-updater asks GitHub for the repository's latest release, so a stable Desktop release is marked latest
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          if [[ "$version" == *-* ]]; then channel=(--prerelease --latest=false); else channel=(--latest); fi
          notes="Appling Desktop $version. Install it as described in https://appling.tools/docs/tools/desktop/. Unsigned builds: macOS asks you to allow the app once (right click, Open) and does not update itself."
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Appling Desktop $version" --notes "$notes" "${channel[@]}"
